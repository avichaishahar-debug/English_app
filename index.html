<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>מילות יחס</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #EDEEFF; font-family: system-ui, -apple-system, sans-serif; }
    .app { max-width: 430px; min-height: 100dvh; margin: 0 auto; background: #F8F9FF; display: flex; flex-direction: column; }
    .scroll { flex: 1; overflow-y: auto; padding-bottom: 76px; }
    .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: white; border-top: 1px solid #E5E7EB; z-index: 99; }
    .tap { transition: transform .1s, opacity .1s; cursor: pointer; }
    .tap:active { transform: scale(.93); opacity: .82; }
    @keyframes pop { 0%{transform:scale(.65);opacity:0} 60%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
    .pop { animation: pop .28s ease-out forwards; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }
    .shake { animation: shake .35s ease; }
    .flip-card { perspective: 900px; }
    .flip-inner { transition: transform .5s; transform-style: preserve-3d; }
    .flip-inner.flipped { transform: rotateY(180deg); }
    .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .face-back { transform: rotateY(180deg); }
    ::-webkit-scrollbar { display: none; }
    input { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const WORDS = [
  { en:"in",          he:"בתוך",    emoji:"📦", ex:"The cat is in the box."     },
  { en:"on",          he:"על",      emoji:"🪑", ex:"The book is on the table."  },
  { en:"under",       he:"מתחת",    emoji:"🛏️", ex:"The dog is under the bed."  },
  { en:"next to",     he:"ליד",     emoji:"🤝", ex:"She sits next to me."       },
  { en:"behind",      he:"מאחורי",  emoji:"🌳", ex:"He hides behind the tree."  },
  { en:"between",     he:"בין",     emoji:"🥪", ex:"She sits between them."     },
  { en:"over",        he:"מעל",     emoji:"🌈", ex:"The plane flies over us."   },
  { en:"in front of", he:"לפני",    emoji:"🚶", ex:"She stands in front of me." },
];

function speak(t,r=.85){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";u.rate=r;
  window.speechSynthesis.speak(u);
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}

/* ── Progress bar ── */
function Bar({n,total,color}){
  return(
    <div className="w-full h-2.5 bg-gray-200 rounded-full overflow-hidden">
      <div className="h-full rounded-full transition-all duration-500" style={{width:`${Math.round((n/total)*100)}%`,background:color}}/>
    </div>
  );
}

/* ── Hearts ── */
function Hearts({n,max=3}){
  return(
    <div className="flex gap-1">
      {Array.from({length:max}).map((_,i)=><span key={i} className={`text-xl ${i<n?'':'opacity-20 grayscale'}`}>❤️</span>)}
    </div>
  );
}

/* ════════════════════════════════════════
   TAB 1 · LEARN — flip cards
════════════════════════════════════════ */
function Learn(){
  const [i,setI]=useState(0);
  const [flip,setFlip]=useState(false);
  const [known,setKnown]=useState(new Set());
  const w=WORDS[i];

  useEffect(()=>{setFlip(false);setTimeout(()=>speak(w.en),260);},[i]);

  return(
    <div className="px-5 pt-6 flex flex-col gap-4 pb-2">
      <div className="flex items-center justify-between">
        <span className="text-xs font-bold text-gray-400 bg-white px-3 py-1 rounded-xl shadow-sm">{i+1}/{WORDS.length}</span>
        <h2 className="text-sm font-black text-violet-700 tracking-wider uppercase">לימוד</h2>
        <span className="text-xs font-bold text-emerald-600 bg-white px-3 py-1 rounded-xl shadow-sm">✓ {known.size}</span>
      </div>
      <Bar n={i+1} total={WORDS.length} color="#7C3AED"/>

      {/* Flip card */}
      <div className="flip-card w-full h-56 select-none" onClick={()=>{setFlip(f=>!f);if(!flip)speak(w.en);}}>
        <div className={`flip-inner w-full h-full relative ${flip?'flipped':''}`}>
          {/* Front — English */}
          <div className="face absolute inset-0 rounded-3xl flex flex-col items-center justify-center gap-3 shadow-lg cursor-pointer"
            style={{background:'linear-gradient(140deg,#6D28D9,#8B5CF6)'}}>
            <div dir="ltr" className="text-4xl font-black text-white tracking-wide">{w.en}</div>
            <button className="tap bg-white/20 text-white/90 text-xs px-4 py-1.5 rounded-xl font-semibold"
              onClick={e=>{e.stopPropagation();speak(w.en);}}>🔊 שמע</button>
            <span className="text-violet-300 text-xs mt-1">לחץ לראות תרגום</span>
          </div>
          {/* Back — Hebrew */}
          <div className="face face-back absolute inset-0 rounded-3xl flex flex-col items-center justify-center gap-2 shadow-lg cursor-pointer"
            style={{background:'linear-gradient(140deg,#065F46,#059669)'}}>
            <div className="text-3xl font-black text-white">{w.he}</div>
            <div dir="ltr" className="text-lg font-bold text-emerald-200">{w.en}</div>
            <div dir="ltr" className="text-xs text-emerald-300 italic text-center px-6 mt-1 leading-5">"{w.ex}"</div>
          </div>
        </div>
      </div>

      {/* Nav */}
      <div className="flex gap-3">
        <button className="tap flex-1 bg-white border border-gray-200 text-gray-600 py-3 rounded-2xl font-bold shadow-sm" onClick={()=>setI(x=>(x-1+WORDS.length)%WORDS.length)}>← הקודם</button>
        <button className="tap flex-1 text-white py-3 rounded-2xl font-bold shadow-md" style={{background:'#7C3AED'}} onClick={()=>setI(x=>(x+1)%WORDS.length)}>הבא →</button>
      </div>

      {/* Mark known */}
      <button className={`tap w-full py-3 rounded-2xl font-bold border-2 transition-all shadow-sm ${known.has(i)?'bg-emerald-500 border-emerald-500 text-white':'bg-white border-gray-200 text-gray-500'}`}
        onClick={()=>setKnown(s=>{const n=new Set(s);n.has(i)?n.delete(i):n.add(i);return n;})}>
        {known.has(i)?'✓ ידוע!':'☆ סמן כידוע'}
      </button>

      {/* Grid — all 8 words */}
      <div className="grid grid-cols-4 gap-2 pt-1">
        {WORDS.map((ww,j)=>(
          <button key={j} className={`tap py-2 px-1 rounded-xl text-xs font-bold border-2 transition-all ${j===i?'border-violet-400 bg-violet-50 text-violet-700':known.has(j)?'border-emerald-300 bg-emerald-50 text-emerald-600':'border-gray-200 bg-white text-gray-500'}`}
            onClick={()=>setI(j)}>
            <div dir="ltr" className="truncate text-xs leading-tight">{ww.en}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   TAB 2 · MATCH — tap pairs
════════════════════════════════════════ */
function Match(){
  const [round,setRound]=useState(0);
  const [pairs,setPairs]=useState([]);
  const [heIdx,setHeIdx]=useState([]);
  const [selEn,setSelEn]=useState(null);
  const [selHe,setSelHe]=useState(null);
  const [matched,setMatched]=useState(new Set());
  const [wrong,setWrong]=useState([]);
  const [errors,setErrors]=useState(0);
  const [done,setDone]=useState(false);

  useEffect(()=>{
    const pool=shuffle(WORDS).slice(0,6);
    setPairs(pool);
    setHeIdx(shuffle(pool.map((_,i)=>i)));
    setSelEn(null);setSelHe(null);setMatched(new Set());setWrong([]);setErrors(0);setDone(false);
  },[round]);

  useEffect(()=>{
    if(selEn===null||selHe===null)return;
    if(selEn===selHe){
      const nm=new Set(matched);nm.add(selEn);
      setMatched(nm);setSelEn(null);setSelHe(null);
      if(nm.size===pairs.length)setTimeout(()=>setDone(true),400);
    } else {
      setErrors(e=>e+1);setWrong([selEn,selHe]);
      setTimeout(()=>{setWrong([]);setSelEn(null);setSelHe(null);},700);
    }
  },[selEn,selHe,matched,pairs]);

  if(!pairs.length)return null;

  if(done)return(
    <div className="flex flex-col items-center gap-6 px-6 pt-16">
      <div className="text-7xl pop">🎉</div>
      <p className="text-2xl font-black text-blue-700 text-center">כל הכבוד!</p>
      <div className="bg-blue-50 rounded-2xl px-10 py-5 text-center shadow-md">
        <div className="text-5xl font-black text-blue-700">{pairs.length}</div>
        <div className="text-blue-400 text-sm font-bold mt-1">זוגות הותאמו</div>
        {errors>0&&<div className="text-red-400 text-xs mt-2">{errors} טעויות</div>}
      </div>
      <button className="tap w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-xl shadow-md" onClick={()=>setRound(r=>r+1)}>🔄 שחק שוב</button>
    </div>
  );

  return(
    <div className="px-4 pt-6 flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <span className="text-xs font-bold text-gray-400 bg-white px-3 py-1 rounded-xl shadow-sm">{matched.size}/{pairs.length} זוגות</span>
        <h2 className="text-sm font-black text-blue-700 tracking-wider uppercase">התאמה</h2>
        <span className="text-xs font-bold text-red-400 bg-white px-3 py-1 rounded-xl shadow-sm">✗ {errors}</span>
      </div>
      <Bar n={matched.size} total={pairs.length} color="#2563EB"/>
      <p className="text-center text-xs text-gray-400 font-medium">חבר כל מילה אנגלית לתרגום שלה</p>

      <div className="grid grid-cols-2 gap-2">
        {/* EN column */}
        <div className="flex flex-col gap-2">
          <div className="text-center text-xs font-bold text-gray-400 mb-0.5">🇬🇧 אנגלית</div>
          {pairs.map((w,j)=>{
            const m=matched.has(j),sw=selEn===j,wr=wrong.includes(j);
            return(
              <button key={j} onClick={()=>{if(m)return;setSelEn(j);speak(w.en);}}
                className={`tap py-3 px-2 rounded-2xl font-bold text-sm border-2 transition-all shadow-sm ${m?'bg-emerald-100 border-emerald-300 text-emerald-600':wr?'bg-red-100 border-red-300 text-red-500 shake':sw?'bg-blue-600 border-blue-600 text-white':'bg-white border-gray-200 text-gray-700'}`}>
                <div dir="ltr" className="text-center leading-tight">{w.en}</div>
              </button>
            );
          })}
        </div>
        {/* HE column */}
        <div className="flex flex-col gap-2">
          <div className="text-center text-xs font-bold text-gray-400 mb-0.5">🇮🇱 עברית</div>
          {heIdx.map((origI,j)=>{
            const w=pairs[origI];
            const m=matched.has(origI),sh=selHe===origI,wr=wrong.includes(origI);
            return(
              <button key={j} onClick={()=>{if(m)return;setSelHe(origI);}}
                className={`tap py-3 px-2 rounded-2xl font-bold text-sm border-2 transition-all shadow-sm ${m?'bg-emerald-100 border-emerald-300 text-emerald-600':wr?'bg-red-100 border-red-300 text-red-500 shake':sh?'bg-amber-500 border-amber-500 text-white':'bg-white border-gray-200 text-gray-700'}`}>
                <div className="text-center">{w.he}</div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   TAB 3 · WRITE — type the English
════════════════════════════════════════ */
function Write(){
  const [queue]=useState(()=>shuffle(WORDS));
  const [i,setI]=useState(0);
  const [typed,setTyped]=useState("");
  const [lives,setLives]=useState(3);
  const [st,setSt]=useState("q"); // q=question c=correct w=wrong r=revealed
  const [score,setScore]=useState({c:0,t:0});
  const [done,setDone]=useState(false);
  const inputRef=useRef(null);
  const word=queue[i];

  useEffect(()=>{
    setSt("q");setTyped("");
    setTimeout(()=>speak(word.en),200);
    setTimeout(()=>inputRef.current?.focus(),350);
  },[i]);

  function submit(){
    if(st!=="q"||!typed.trim())return;
    const ok=typed.trim().toLowerCase()===word.en.toLowerCase();
    if(ok){
      setSt("c");setScore(s=>({c:s.c+1,t:s.t+1}));
      setTimeout(next,1200);
    } else {
      const nl=lives-1;setLives(nl);
      if(nl<=0){setSt("r");setScore(s=>({c:s.c,t:s.t+1}));}
      else{setSt("w");setTyped("");setTimeout(()=>{setSt("q");inputRef.current?.focus();},850);}
    }
  }
  function next(){
    if(i+1>=queue.length){setDone(true);return;}
    setI(x=>x+1);setLives(3);setTyped("");setSt("q");
  }

  if(done)return(
    <div className="flex flex-col items-center gap-6 px-6 pt-16">
      <div className="text-7xl pop">🏆</div>
      <p className="text-2xl font-black text-emerald-700 text-center">כל הכבוד! סיימת!</p>
      <div className="bg-emerald-50 rounded-2xl px-10 py-5 text-center shadow-md">
        <div className="text-5xl font-black text-emerald-700">{score.c}/{score.t}</div>
        <div className="text-emerald-400 text-sm font-bold mt-1">תשובות נכונות</div>
      </div>
      <button className="tap w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-xl shadow-md"
        onClick={()=>{setI(0);setLives(3);setScore({c:0,t:0});setDone(false);}}>🔄 נסה שוב</button>
    </div>
  );

  const underline=word.en.split('').map((c,j)=>
    c===' '?<span key={j} className="inline-block w-3"/>:
    <span key={j} className={`inline-block w-6 mx-0.5 border-b-2 ${st==='c'?'border-emerald-400':st==='w'||st==='r'?'border-red-300':'border-white/50'}`}/>
  );

  return(
    <div className="px-5 pt-5 flex flex-col gap-3">
      <div className="flex items-center justify-between">
        <Hearts n={lives}/>
        <h2 className="text-sm font-black text-emerald-700 tracking-wider uppercase">כתיבה</h2>
        <span className="text-xs font-bold text-emerald-600 bg-white px-3 py-1 rounded-xl shadow-sm">{score.c}/{score.t}</span>
      </div>
      <Bar n={i} total={queue.length} color="#059669"/>

      {/* Compact card */}
      <div className={`w-full rounded-2xl p-4 shadow-md transition-all ${st==='c'?'ring-4 ring-emerald-400':st==='w'||st==='r'?'ring-4 ring-red-300':''}`}
        style={{background:'linear-gradient(140deg,#065F46,#059669)'}}>
        <div className="flex items-center gap-4">
          <div className="flex flex-col gap-1 flex-1 items-center">
            <div className="text-3xl font-black text-white">{word.he}</div>
            <button className="tap bg-white/20 text-white px-3 py-1 rounded-lg text-xs font-semibold"
              onClick={()=>speak(word.en)}>🔊 שמע</button>
          </div>
        </div>
        <div dir="ltr" className="flex items-end flex-wrap justify-center mt-3 mb-1">{underline}</div>
      </div>

      {/* Input */}
      {st!=='r'&&(
        <div className={`flex gap-2 ${st==='w'?'shake':''}`}>
          <input ref={inputRef} dir="ltr" type="text" value={typed}
            onChange={e=>setTyped(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&submit()}
            disabled={st==='c'}
            placeholder="כתוב כאן..."
            className={`flex-1 border-2 rounded-2xl px-4 py-3.5 text-xl font-bold text-center outline-none transition-all ${
              st==='c'?'border-emerald-400 bg-emerald-50 text-emerald-700':
              st==='w'?'border-red-300 bg-red-50 text-red-600':
              'border-gray-200 bg-white focus:border-emerald-400'}`}
            autoComplete="off" autoCorrect="off" autoCapitalize="none" spellCheck="false"/>
          <button className="tap px-5 rounded-2xl font-black text-2xl text-white shadow-md"
            style={{background:'#059669'}} onClick={submit}>✓</button>
        </div>
      )}

      {st==='c'&&<div className="bg-emerald-100 text-emerald-700 text-center py-3 rounded-2xl font-black text-lg pop shadow-sm">✓ מצוין!</div>}
      {st==='r'&&(
        <div className="bg-red-50 border-2 border-red-200 rounded-2xl p-4 flex flex-col items-center gap-2 pop shadow-sm">
          <p className="text-red-500 font-bold text-sm">התשובה הנכונה:</p>
          <div dir="ltr" className="text-2xl font-black text-red-700">{word.en}</div>
          <button className="tap mt-1 bg-red-500 text-white px-8 py-2.5 rounded-xl font-bold shadow-sm" onClick={next}>הבא ←</button>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════
   TAB 4 · QUIZ — multiple choice
════════════════════════════════════════ */
function Quiz(){
  const [queue]=useState(()=>shuffle(WORDS));
  const [i,setI]=useState(0);
  const [opts,setOpts]=useState([]);
  const [sel,setSel]=useState(null);
  const [lives,setLives]=useState(3);
  const [score,setScore]=useState({c:0,t:0});
  const [done,setDone]=useState(false);
  const timerRef=useRef(null);
  const word=queue[i];

  useEffect(()=>{
    if(!word)return;
    const wrong=shuffle(WORDS.filter(w=>w.en!==word.en)).slice(0,3);
    setOpts(shuffle([word,...wrong]));
    setSel(null);
    setTimeout(()=>speak(word.en),200);
    return ()=>clearTimeout(timerRef.current);
  },[i]);

  function pick(opt){
    if(sel)return;
    setSel(opt.en);
    const ok=opt.en===word.en;
    setScore(s=>({c:s.c+(ok?1:0),t:s.t+1}));
    if(!ok){const nl=lives-1;setLives(nl);if(nl<=0){timerRef.current=setTimeout(()=>setDone(true),1800);return;}}
    timerRef.current=setTimeout(()=>{if(i+1>=queue.length)setDone(true);else setI(x=>x+1);},1400);
  }

  if(done)return(
    <div className="flex flex-col items-center gap-6 px-6 pt-16">
      <div className="text-7xl pop">{lives>0?'🎊':'😅'}</div>
      <p className="text-2xl font-black text-amber-700 text-center">{lives>0?'כל הכבוד!':'נגמרו הלבבות...'}</p>
      <div className="bg-amber-50 rounded-2xl px-10 py-5 text-center shadow-md">
        <div className="text-5xl font-black text-amber-700">{score.c}/{score.t}</div>
        <div className="text-amber-400 text-sm font-bold mt-1">תשובות נכונות</div>
      </div>
      <button className="tap w-full bg-amber-500 text-white py-4 rounded-2xl font-black text-xl shadow-md"
        onClick={()=>{setI(0);setLives(3);setScore({c:0,t:0});setDone(false);}}>🔄 שחק שוב</button>
    </div>
  );

  return(
    <div className="px-5 pt-6 flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <Hearts n={lives}/>
        <h2 className="text-sm font-black text-amber-700 tracking-wider uppercase">חידון</h2>
        <span className="text-xs font-bold text-emerald-600 bg-white px-3 py-1 rounded-xl shadow-sm">{score.c}/{score.t}</span>
      </div>
      <Bar n={i} total={queue.length} color="#D97706"/>

      {/* Question card */}
      <div className="w-full rounded-3xl p-6 flex flex-col items-center gap-3 shadow-lg"
        style={{background:'linear-gradient(140deg,#B45309,#D97706)'}}>
        <p className="text-amber-100 text-sm font-semibold">מה הפירוש בעברית?</p>
        <div dir="ltr" className="text-4xl font-black text-white tracking-wide">{word.en}</div>
        <button className="tap bg-white/20 text-white px-5 py-1.5 rounded-xl text-sm font-semibold"
          onClick={()=>speak(word.en)}>🔊 שמע</button>
      </div>

      {/* Options 2×2 */}
      <div className="grid grid-cols-2 gap-3">
        {opts.map((opt,j)=>{
          const cor=opt.en===word.en,pck=sel===opt.en;
          let cls="tap py-5 rounded-2xl font-black text-xl border-2 transition-all shadow-sm ";
          if(!sel)cls+="bg-white border-gray-200 text-gray-700";
          else if(cor)cls+="bg-emerald-500 border-emerald-500 text-white";
          else if(pck)cls+="bg-red-400 border-red-400 text-white";
          else cls+="bg-gray-100 border-gray-100 text-gray-400";
          return <button key={j} className={cls} onClick={()=>pick(opt)}>{opt.he}</button>;
        })}
      </div>

      {sel&&(
        <div className={`text-center py-3 rounded-2xl font-black text-lg pop shadow-sm ${sel===word.en?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-600'}`}>
          {sel===word.en?'✓ נכון!':(<>✗ התשובה: <span dir="rtl">{word.he}</span></>)}
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════
   MAIN APP
════════════════════════════════════════ */
const TABS=[
  {id:"learn",icon:"📖",label:"לימוד",  color:"#7C3AED"},
  {id:"match",icon:"🎯",label:"התאמה", color:"#2563EB"},
  {id:"write",icon:"✍️", label:"כתיבה", color:"#059669"},
  {id:"quiz", icon:"🧠",label:"חידון", color:"#D97706"},
];

function App(){
  const [tab,setTab]=useState("learn");
  const tc=TABS.find(t=>t.id===tab).color;
  return(
    <div className="app shadow-2xl">
      {/* Header */}
      <div className="flex items-center justify-between px-5 py-3.5" style={{background:tc}}>
        <div className="text-white font-black text-lg tracking-tight">מילות יחס 📍</div>
        <div className="text-white/60 text-xs font-bold">כיתה ד׳ · {WORDS.length} מילים</div>
      </div>
      {/* Content */}
      <div className="scroll">
        {tab==="learn"&&<Learn/>}
        {tab==="match"&&<Match/>}
        {tab==="write"&&<Write/>}
        {tab==="quiz" &&<Quiz/>}
      </div>
      {/* Tab bar */}
      <div className="tabbar">
        <div className="flex">
          {TABS.map(t=>(
            <button key={t.id} className="tap flex-1 flex flex-col items-center py-2.5 gap-0.5"
              style={tab===t.id?{borderTop:`3px solid ${t.color}`}:{borderTop:'3px solid transparent'}}
              onClick={()=>setTab(t.id)}>
              <span className="text-xl leading-none">{t.icon}</span>
              <span className="text-xs font-bold" style={{color:tab===t.id?t.color:'#9CA3AF'}}>{t.label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
